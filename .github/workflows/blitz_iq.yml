name: Update Blitz IQ (NFL) Report

on:
  schedule:
    - cron: '0 9 * * *'   # once daily at 09:00 UTC — adjust to taste
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build Blitz IQ report
        run: python nfl_model.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Blitz IQ report $(date -u +%Y-%m-%d)"
          git push
